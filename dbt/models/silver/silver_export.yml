version: 2

models:
  - name: silver_export
    description: Clean export trade data ready for analytics.

    columns:
      - name: trade_year
        tests:
          - not_null

      - name: reporter_country
        tests:
          - not_null

      - name: partner_country
        tests:
          - not_null

      - name: trade_value_usd
        tests:
          - not_null

      - name: commodity_code
        tests:
          - not_null