version: 2

models:
  - name: fact_import
    description: Monthly import fact table by reporter, partner, and commodity.

    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: reporter_country_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key

      - name: partner_country_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key

      - name: commodity_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commodity')
                field: commodity_key

      - name: trade_value_usd
        tests:
          - not_null