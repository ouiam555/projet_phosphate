version: 2

models:
  - name: fact_inflation
    description: Annual inflation fact table by country.

    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: country_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key

      - name: inflation_rate
        tests:
          - not_null