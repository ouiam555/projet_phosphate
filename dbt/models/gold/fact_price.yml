version: 2

models:
  - name: fact_price
    description: Monthly phosphate price fact table.

    columns:
      - name: date_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: phosphate_price_usd
        tests:
          - not_null