version: 2

models:
  - name: fact_production
    description: Annual phosphate production fact table.

    columns:

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: country_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key

      - name: production_ktons