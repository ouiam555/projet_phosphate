version: 2

models:
  - name: dim_date
    description: Monthly date dimension from 2016 to 2026.

    columns:
      - name: date_key
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null
          - unique

      - name: year
        tests:
          - not_null

      - name: month_number
        tests:
          - not_null